name: ${COMPOSE_PROJECT_NAME:-alcabots-podman}
services:
  alca:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/alcabots-podman:${ALCA_IMAGE_TAG:-local}
    # Collects exited child processes; Chrome's shared memory as on the
    # desktop containers.
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${ALCA_DATA_ROOT:?Run setup.sh first}:${ALCA_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/alca-podman.sock
    environment:
      HOME: ${ALCA_DATA_ROOT}
      ALCA_DATA_DIR: ${ALCA_DATA_ROOT}/.alcabots
      ALCA_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/alca-podman.sock
      ALCA_PORT: ${ALCA_PORT:-8799}
      ALCA_WEBHOOK_PORT: ${ALCA_WEBHOOK_PORT:-8800}
      ALCA_PUBLIC_URL: ${ALCA_PUBLIC_URL:-http://localhost:8080}
      ALCA_WEBHOOK_PUBLIC_URL: ${ALCA_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$ALCA_PORT/api/health | grep -q alcabots']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      alca:
        condition: service_healthy
    environment:
      ALCA_HTTP_PORT: ${ALCA_HTTP_PORT:-8080}
      ALCA_PORT: ${ALCA_PORT:-8799}
      ALCA_WEBHOOK_PORT: ${ALCA_WEBHOOK_PORT:-8800}
      ALCA_HTTPS_HOST: ${ALCA_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
