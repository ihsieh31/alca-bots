# One AlcaBots tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `alca` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose pull alca && docker compose up -d     # prebuilt image
#   docker compose up -d --build                        # or build from source
services:
  alca:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    # prebuilt on every main push; `docker compose up --build` builds from source instead
    image: ghcr.io/ihsieh31/alca-bots:latest
    restart: unless-stopped
    # An init collects child processes whose parents exit.
    init: true
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALCA_PORT: "8799"
      ALCA_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      ALCA_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      ALCA_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      ALCA_SIGNIN_EMAILS: ${ALCA_SIGNIN_EMAILS:-}
      ALCA_SIGNIN_MEMBER_EMAILS: ${ALCA_SIGNIN_MEMBER_EMAILS:-}
      # Send the codes through your own mail server (same section of the docs).
      ALCA_SIGNIN_SMTP_URL: ${ALCA_SIGNIN_SMTP_URL:-}
      ALCA_SIGNIN_SMTP_FROM: ${ALCA_SIGNIN_SMTP_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q alcabots"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:alca"
    depends_on:
      alca:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
